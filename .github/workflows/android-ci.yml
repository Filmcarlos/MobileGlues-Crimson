name: Android CI — Lint & Release Build

on:
  push:
    branches: [ "main", "master", "develop" ]
    tags:
      - "v*.*.*"
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Lint, Unit Tests & Assemble Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Prepare Signing Keystore (Release & Debug)
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass androidrelease \
              -keypass androidrelease \
              -dname "CN=CrimsonDev, OU=RendererPlugin, O=CrimsonDev, L=Bangkok, S=Bangkok, C=TH"
          fi

      - name: Run Android Lint
        run: gradle :app:lintDebug --no-configuration-cache --stacktrace

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --no-configuration-cache --stacktrace

      - name: Assemble Debug & Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'androidrelease' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'androidrelease' }}
        run: gradle :app:assembleDebug :app:assembleRelease --no-configuration-cache --stacktrace

      - name: Locate & Rename Built APK Outputs
        id: prepare_apks
        if: success()
        run: |
          mkdir -p dist

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION_LABEL="${{ github.ref_name }}"
          else
            VERSION_LABEL="v1.0.0-${GITHUB_SHA::7}"
          fi

          RELEASE_APK_SRC=$(find app/build/outputs/apk/release -maxdepth 2 -type f -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK_SRC" ]; then
            echo "::error::Release APK was not found in app/build/outputs/apk/release"
            exit 1
          fi
          RELEASE_APK_DEST="dist/MobileGlues-Crimson-${VERSION_LABEL}.apk"
          cp "$RELEASE_APK_SRC" "$RELEASE_APK_DEST"
          echo "Prepared Release APK: $RELEASE_APK_DEST"

          DEBUG_APK_SRC=$(find app/build/outputs/apk/debug -maxdepth 2 -type f -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK_SRC" ]; then
            DEBUG_APK_DEST="dist/MobileGlues-Crimson-${VERSION_LABEL}-debug.apk"
            cp "$DEBUG_APK_SRC" "$DEBUG_APK_DEST"
            echo "Prepared Debug APK: $DEBUG_APK_DEST"
          fi

          ls -lh dist/

      - name: Upload Lint & Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/

      - name: Upload Release & Debug APK Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mobileglues-crimson-apks
          path: |
            dist/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Publish APK to GitHub Releases
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "MobileGlues Crimson ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            dist/MobileGlues-Crimson-${{ github.ref_name }}.apk
            dist/MobileGlues-Crimson-${{ github.ref_name }}-debug.apk
