name: Android CI — Lint & Release Build

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Lint, Unit Tests & Assemble Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Prepare Signing Keystore (Release & Debug)
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass androidrelease \
              -keypass androidrelease \
              -dname "CN=CrimsonDev, OU=RendererPlugin, O=CrimsonDev, L=Bangkok, S=Bangkok, C=TH"
          fi

      - name: Run Android Lint
        run: gradle :app:lintDebug

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest

      - name: Assemble Debug & Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'androidrelease' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'androidrelease' }}
        run: gradle :app:assembleDebug :app:assembleRelease

      - name: Upload Lint Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Upload Release & Debug APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobileglues-crimson-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
